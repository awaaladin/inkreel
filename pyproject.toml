[project]
name = "inkreel"
version = "0.1.0"
description = "Terminal-driven 2D animation studio for whole series"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.27", "rich>=13", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pillow", "numpy"]

[project.scripts]
inkreel = "inkreel.cli:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
